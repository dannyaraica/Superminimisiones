.lv{display:flex;gap:8px}.lv button{padding:8px 14px;font-size:15px;background:#fff3;border:1px solid #fff6}

const dt=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.4" fill="#2b2118"/><circle cx="${x+1}" cy="${y-1.2}" r="1.1" fill="#fff"/>`;
const bk=(x,y)=>`<circle cx="${x}" cy="${y}" r="4.5" fill="#ff7a6a" opacity=".3"/>`;
const sm=`<path d="M51 62Q60 70 69 62" stroke="#8a3b2b" stroke-width="2" fill="none" stroke-linecap="round"/>`;
const sd='<ellipse cx="60" cy="146" rx="30" ry="4" fill="#0002"/>';
const KID=mk(sd+`<ellipse cx="46" cy="140" rx="14" ry="7" fill="#8a5a3b"/><ellipse cx="76" cy="140" rx="14" ry="7" fill="#8a5a3b"/><ellipse cx="60" cy="108" rx="26" ry="30" fill="#e8a13a"/><path d="M36 100h48M36 114h48" stroke="#fff" stroke-width="5" opacity=".6"/><ellipse cx="32" cy="106" rx="8" ry="13" transform="rotate(25 32 106)" fill="#f1c7a0"/><ellipse cx="88" cy="106" rx="8" ry="13" transform="rotate(-25 88 106)" fill="#f1c7a0"/><circle cx="60" cy="52" r="30" fill="#f1c7a0"/><path d="M30 48Q32 18 60 18Q88 18 90 48Z" fill="#d94f4f"/><path d="M33 38Q60 30 87 38M31 46Q60 38 89 46" stroke="#fff" stroke-width="4" fill="none" opacity=".85"/><ellipse cx="60" cy="48" rx="34" ry="5" fill="#b33c3c"/>`+dt(50,60)+dt(70,60)+sm+bk(42,68)+bk(78,68),"0 0 120 150");
const GIRL=mk(sd+`<circle cx="22" cy="104" r="20" fill="#bfe6f5" opacity=".85" stroke="#8ab8d0" stroke-width="2"/><circle cx="98" cy="104" r="20" fill="#bfe6f5" opacity=".85" stroke="#8ab8d0" stroke-width="2"/><rect x="48" y="130" width="8" height="14" rx="4" fill="#f1c7a0"/><rect x="64" y="130" width="8" height="14" rx="4" fill="#f1c7a0"/><ellipse cx="60" cy="108" rx="20" ry="28" fill="#e0719a"/><path d="M50 90v38M60 88v42M70 90v38M42 106h36M44 118h32" stroke="#fff" stroke-width="2" opacity=".6"/><path d="M32 54Q28 80 38 84M88 54Q92 80 82 84" stroke="#5b3a24" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="60" cy="52" r="28" fill="#f1c7a0"/><path d="M32 54Q30 20 60 20Q90 20 88 54Q80 34 60 36Q40 34 32 54Z" fill="#5b3a24"/><path d="M54 18l-10-6v12zM66 18l10-6v12z" fill="#e0719a"/><circle cx="60" cy="19" r="3.5" fill="#e0719a"/>`+dt(50,56)+dt(70,56)+`<path d="M52 66Q60 73 68 66" stroke="#8a3b2b" stroke-width="2" fill="none" stroke-linecap="round"/>`+bk(42,64)+bk(78,64),"0 0 120 150");
const OCT=mk(sd+`<path d="M46 96L26 142L60 112Z" fill="#3b7fd1"/><path d="M74 96L94 142L60 112Z" fill="#3b7fd1"/><path d="M60 12C82 12 94 40 92 62C90 84 74 102 60 102C46 102 30 84 28 62C26 40 38 12 60 12Z" fill="#4a90e2"/><ellipse cx="48" cy="34" rx="7" ry="11" fill="#fff" opacity=".35"/><circle cx="46" cy="56" r="7" fill="#fff"/><circle cx="74" cy="56" r="7" fill="#fff"/><circle cx="47" cy="57" r="3.6" fill="#1b2b4a"/><circle cx="73" cy="57" r="3.6" fill="#1b2b4a"/><path d="M48 72Q60 84 72 72" stroke="#1b2b4a" stroke-width="2.4" fill="none" stroke-linecap="round"/>`+bk(38,70)+bk(82,70),"0 0 120 150");
const IG=GOOD.map(c=>mk(c.s,c.v)),IB=BAD.map(c=>mk(c.s,c.v)),IW=WORLD.map(w=>mk(w.s,"0 0 200 130"));
const LV=[
{nm:"1 · El campo",h:IG[0],r:[KID],v:[[IB[1],.8,60],[IB[0],.7,60]],ball:3,t:"Un niño se perdió. Lleva a Felipe hasta él. ¡Esquiva las tortugas y las pelotas que ruedan!",ok:"¡Felipe encontró al niño y lo llevó a casa!"},
{nm:"2 · Bosque de hongos",h:IG[4],r:[GIRL],v:[[IB[3],1.5,56],[IB[3],1.3,56]],mush:3,t:"Una niña quedó atrapada entre los hongos. Coni va a salvarla. ¡Cuidado con Rie, el insecto volador!",ok:"¡Coni salvó a la niña!"},
{nm:"3 · La ciudad",h:IG[2],r:[IG[1]],v:[[IB[4],1,88]],need:["fire",3,"🔥 Fuegos"],t:"¡Hay fuego en la ciudad y Oso está atrapado! Eli apaga los 3 fuegos con su trompa: acércate a cada uno.",ok:"¡Eli apagó el fuego y salvó a Oso!"},
{nm:"4 · El mar",h:IG[1],r:[OCT],v:[[IB[5],1.2,66],[IB[5],1,66]],need:["bub",3,"🫧 Burbujas"],t:"Un pulpito azul está perdido en el mar. Oso nada y junta 3 burbujas. ¡Cuidado con los tentáculos!",ok:"¡Oso rescató al pulpito!"},
{nm:"5 · El castillo de fuego",h:IG[3],r:[IG[0],IG[4]],v:[[IB[2],1.9,112,1],[IB[6],1.2,58]],need:["btn",3,"🔴 Botones"],t:"¡Origo encerró a Felipe y a Coni! Super Dino pisa los 3 botones rojos para abrir la puerta.",ok:"¡Super Dino rescató a todos!"}];
const W=480,H=400,cv=document.getElementById("c"),g=cv.getContext("2d"),ov=document.getElementById("ov"),nm=document.getElementById("nm"),ct=document.getElementById("ct");
let L=0,state="menu",hero,tg,inv,vs,bl,ms,it,done,tm="",tt=0,fr=0;
const R=(a,b)=>a+Math.random()*(b-a);
function dr(im,x,y,s){if(!im.complete||!im.naturalWidth)return;const k=s/Math.max(im.naturalWidth,im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;g.drawImage(im,x-w/2,y-h/2,w,h)}
function toast(t){tm=t;tt=110}
function show(h,b,fn,extra){ov.style.display="flex";ov.innerHTML=h+`<button id="go">${b}</button>`+(extra||"");document.getElementById("go").onclick=fn;document.querySelectorAll(".lv button").forEach((e,i)=>e.onclick=()=>intro(i))}
function menu(){state="menu";nm.textContent="";ct.textContent="";show("<h2>🦸 Misiones de Rescate</h2><p>Toca la pantalla para mover a tu héroe y rescata a todos. ¡No hay que tener miedo!</p>","Empezar",()=>intro(0),'<div class="lv">'+LV.map((l,i)=>`<button>${i+1}</button>`).join("")+"</div>")}
function intro(i){L=i;init();state="menu";const l=LV[i];show(`<h2>${l.nm}</h2><p>${l.t}</p>`,"¡A jugar!",()=>{ov.style.display="none";state="play"})}
function init(){const l=LV[L];nm.textContent=l.nm;hero={x:W/2,y:H-44};tg={x:hero.x,y:hero.y};inv=0;done=0;tt=0;
vs=l.v.map(([im,sp,sz,hz],j)=>({im,sz,hz,x:R(70,W-70),y:hz?190:R(110,300),dx:(Math.random()<.5?-1:1)*sp,dy:hz?0:(Math.random()<.5?-1:1)*sp*R(.5,1)}));
bl=[];if(l.ball)for(let j=0;j<l.ball;j++)bl.push({x:R(0,W),y:150+j*70,dx:(j%2?-1:1)*1.7});
ms=[];if(l.mush)ms=[{x:110,y:200,r:30,c:"#d94f4f"},{x:250,y:140,r:26,c:"#e8a13a"},{x:380,y:230,r:30,c:"#d94f8a"}];
it=[];if(l.need)for(let j=0;j<l.need[1];j++)it.push({x:80+j*150+R(-20,20),y:R(140,300),t:l.need[0]});
const n=l.r.length;ct.textContent=l.need?l.need[2]+" 0/"+l.need[1]:""}
cv.addEventListener("pointerdown",e=>{pt(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")pt(e)});
function pt(e){const r=cv.getBoundingClientRect();tg={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function hit(){inv=90;hero={x:W/2,y:H-44};tg={...hero};toast("¡Ups! Inténtalo otra vez 💪")}
function win(){state="win";const l=LV[L];show(`<h2>🎉 ¡Rescate completado!</h2><p>${l.ok}</p>`,L<4?"Siguiente misión":"Jugar de nuevo",()=>L<4?intro(L+1):menu())}
function step(){fr++;if(inv>0)inv--;if(tt>0)tt--;
const dx=tg.x-hero.x,dy=tg.y-hero.y,d=Math.hypot(dx,dy);if(d>3){const m=Math.min(3.3,d);hero.x+=dx/d*m;hero.y+=dy/d*m}
hero.x=Math.max(30,Math.min(W-30,hero.x));hero.y=Math.max(60,Math.min(H-30,hero.y));
ms.forEach(m=>{const a=hero.x-m.x,b=hero.y-(m.y-4),q=Math.hypot(a,b),rr=m.r*.85+16;if(q<rr&&q>0){hero.x=m.x+a/q*rr;hero.y=m.y-4+b/q*rr;tg={...hero}}});
vs.forEach(v=>{v.x+=v.dx;v.y+=v.dy;if(v.x<35||v.x>W-35)v.dx*=-1;if(!v.hz&&(v.y<110||v.y>H-40))v.dy*=-1;if(inv===0&&Math.hypot(v.x-hero.x,v.y-hero.y)<v.sz/2.6+18)hit()});
bl.forEach(b=>{b.x+=b.dx;if(b.x>W+20)b.x=-20;if(b.x<-20)b.x=W+20;if(inv===0&&Math.hypot(b.x-hero.x,b.y-hero.y)<30)hit()});
it=it.filter(o=>{if(Math.hypot(o.x-hero.x,o.y-hero.y)<36){done++;const l=LV[L];ct.textContent=l.need[2]+" "+done+"/"+l.need[1];if(done===l.need[1])toast("¡Listo! Ahora ve a rescatar 🎉");return false}return true});
const l=LV[L],n=l.r.length;l.r.forEach((_,i)=>{const rx=W/2+(n>1?(i?42:-42):0);if(Math.hypot(rx-hero.x,64-hero.y)<46){if(it.length)toast("¡Primero completa: "+l.need[2]+"!");else win()}})}
function draw(){const l=LV[L],bg=IW[L];
if(bg.complete&&bg.naturalWidth){const iw=bg.naturalWidth,ih=bg.naturalHeight,s=Math.max(W/iw,H/ih),sw=W/s,sh=H/s;g.drawImage(bg,(iw-sw)/2,(ih-sh)/2,sw,sh,0,0,W,H)}else{g.fillStyle="#9fd6f2";g.fillRect(0,0,W,H)}
ms.forEach(m=>{g.fillStyle="#f3e6cf";g.fillRect(m.x-8,m.y-4,16,m.r+2);g.fillStyle=m.c;g.beginPath();g.arc(m.x,m.y-4,m.r,Math.PI,0);g.fill();g.fillStyle="#fff";g.beginPath();g.arc(m.x-9,m.y-18,4,0,7);g.arc(m.x+8,m.y-12,3,0,7);g.fill()});
it.forEach(o=>{const p=1+Math.sin(fr/10)*.12;g.save();g.translate(o.x,o.y);g.scale(p,p);if(o.t==="fire"){g.font="34px serif";g.textAlign="center";g.textBaseline="middle";g.fillText("🔥",0,0)}else if(o.t==="bub"){g.fillStyle="#ffffff55";g.strokeStyle="#fff";g.lineWidth=3;g.beginPath();g.arc(0,0,16,0,7);g.fill();g.stroke();g.fillStyle="#fff";g.beginPath();g.arc(-5,-6,3,0,7);g.fill()}else{g.fillStyle="#fff";g.beginPath();g.arc(0,0,19,0,7);g.fill();g.fillStyle="#d94f4f";g.beginPath();g.arc(0,0,14,0,7);g.fill()}g.restore()});
const n=l.r.length;l.r.forEach((im,i)=>dr(im,W/2+(n>1?(i?42:-42):0),64+Math.sin(fr/12+i)*3,70));
bl.forEach(b=>{g.fillStyle="#fff";g.strokeStyle="#d94f4f";g.lineWidth=3;g.beginPath();g.arc(b.x,b.y,14,0,7);g.fill();g.stroke();g.beginPath();g.moveTo(b.x-7,b.y-7);g.lineTo(b.x+7,b.y+7);g.moveTo(b.x+7,b.y-7);g.lineTo(b.x-7,b.y+7);g.stroke()});
vs.forEach(v=>dr(v.im,v.x,v.y,v.sz));
if(inv===0||fr%8<4)dr(l.h,hero.x,hero.y,66);
if(tt>0){g.fillStyle="#000a";g.beginPath();g.roundRect(W/2-170,H-70,340,34,12);g.fill();g.fillStyle="#fff";g.font="16px system-ui";g.textAlign="center";g.textBaseline="middle";g.fillText(tm,W/2,H-53)}}
function loop(){if(state==="play")step();draw();requestAnimationFrame(loop)}
init();menu();loop();
</script>
